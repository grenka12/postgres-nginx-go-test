name: CI/CD Docker Compose Local

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build and start containers
        run: |
          docker compose up
          
      - name: Clean up old containers (optional)
        run: docker system prune -f
